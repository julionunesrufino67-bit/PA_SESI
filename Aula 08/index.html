<!DOCTYPE html>
<html>
<head>
    <title>Cadastro</title>
</head>
<body>

    <input type="text" id="nome"><br><br>
    <input type="text" id="sobrenome"><br><br>
    <input type="number" id="idade"><br><br>
    <input type="text" id="profissao"><br><br>
    <button onclick="exibirMensagem()">Cadastrar</button>
    <script>
        function exibirMensagem() {
            var nome = document.getElementById("nome").value;
            var sobrenome = document.getElementById("sobrenome").value;
            var idade = document.getElementById("idade").value;
            var profissao = document.getElementById("profissao").value;

            alert("Bem-vindo, " + nome + " " + sobrenome +
                  ", você tem " + idade +
                  " anos e trabalha como " + profissao + ".");
        }
    </script>
</body>
